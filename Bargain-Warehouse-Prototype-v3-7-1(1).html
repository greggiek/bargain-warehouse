<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Bargain Warehouse</title>
  <style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --line: #e5e7eb;
  --brand: #4f46e5;
  --brand-dark: #3730a3;
  --green: #15803d;
  --red: #b91c1c;
  --orange: #c2410c;
  --shadow: 0 10px 30px rgba(17, 24, 39, .06);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; }
button { cursor: pointer; }
.app-shell { max-width: 1180px; margin: 0 auto; min-height: 100vh; padding: 18px; }
.topbar { display:flex; justify-content:space-between; gap:16px; align-items:center; padding: 6px 0 18px; }
.topbar h1 { margin: 2px 0 0; font-size: 30px; }
.top-actions { display:flex; gap:10px; align-items:center; }
.top-actions select { min-width: 210px; }
select, input { border:1px solid var(--line); background:#fff; border-radius:12px; min-height:48px; padding:0 14px; color:var(--text); }
.icon-btn { width:48px; height:48px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:24px; }
.eyebrow { font-size:12px; font-weight:800; letter-spacing:.09em; color:var(--muted); }
.hero-card, .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); }
.hero-card { padding:24px; display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:18px; }
.hero-card h2 { margin:5px 0 6px; font-size:28px; }
.muted { color:var(--muted); }
.status-pill { background:#eef2ff; color:var(--brand-dark); font-weight:800; border-radius:999px; padding:8px 12px; }
.action-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:14px; margin-bottom:18px; }
.action-card { border:0; border-radius:20px; padding:22px; text-align:left; color:#fff; display:grid; grid-template-columns:58px 1fr auto; gap:16px; align-items:center; min-height:140px; box-shadow:var(--shadow); }
.action-card.receive { background:linear-gradient(135deg,#2563eb,#4f46e5); }
.action-card.transfer { background:linear-gradient(135deg,#0f766e,#0891b2); }
.action-card.adjust { background:linear-gradient(135deg,#a16207,#ea580c); }
.action-card.pick { background:linear-gradient(135deg,#6d28d9,#7c3aed); }
.pick-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pick-choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:20px;text-align:left;display:flex;justify-content:space-between;gap:18px;align-items:center}.pick-choice h3{margin:4px 0 6px;font-size:21px}.pick-choice:hover{border-color:#a78bfa}.pick-status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f5f3ff;color:#5b21b6;font-size:12px;font-weight:800}.order-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.scan-feedback.pack{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}@media(max-width:700px){.pick-choice-grid{grid-template-columns:1fr}.order-summary-grid{grid-template-columns:1fr 1fr}}
.action-card h3 { margin:0 0 5px; font-size:22px; }
.action-card p { margin:0; opacity:.86; }
.action-card > span { font-size:34px; }
.action-icon { width:58px; height:58px; display:grid; place-items:center; border-radius:16px; background:rgba(255,255,255,.16); font-size:30px; }
.panel { padding:22px; margin-bottom:18px; }
.panel.compact { padding-bottom:18px; }
.section-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:18px; }
.section-head h2,.section-head h3 { margin:4px 0 0; }
.scan-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
.scan-row.spaced { margin-top:18px; }
.scan-input { font-size:18px; min-height:56px; }
.primary,.success,.danger,.secondary { min-height:48px; border:0; border-radius:12px; padding:0 18px; font-weight:800; }
.primary { background:var(--brand); color:#fff; }
.success { background:var(--green); color:#fff; }
.danger { background:var(--red); color:#fff; }
.secondary { background:#eef2f7; color:var(--text); }
button:disabled { opacity:.45; cursor:not-allowed; }
.quick-list { margin-top:14px; display:grid; gap:8px; }
.quick-po { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; text-align:left; display:grid; grid-template-columns:120px 1fr 160px; gap:12px; align-items:center; }
.hidden { display:none !important; }
.po-meta { display:flex; flex-wrap:wrap; gap:10px 16px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.po-meta strong { font-size:20px; }
.line-list { display:grid; gap:10px; margin-top:14px; }
.line-item { border:1px solid var(--line); border-radius:15px; padding:14px; display:grid; grid-template-columns:1fr 120px 120px auto; gap:12px; align-items:center; }
.line-item .name { font-weight:800; }
.qty-box { display:flex; align-items:center; gap:6px; }
.qty-box input { width:78px; text-align:center; min-height:42px; }
.qty-box button { width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; }
.summary-bar { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); display:flex; gap:24px; align-items:center; justify-content:flex-end; }
.summary-bar > div { display:flex; flex-direction:column; min-width:70px; }
.summary-bar strong { font-size:24px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.two-col label, .adjust-grid label { display:grid; gap:7px; font-weight:700; }
.activity-list { display:grid; gap:8px; }
.activity-item { display:grid; grid-template-columns:90px 1fr auto; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
.activity-item:first-child { border-top:0; }
.activity-badge { font-size:12px; font-weight:800; border-radius:999px; padding:6px 8px; text-align:center; background:#eef2ff; color:var(--brand-dark); }
.adjust-card { margin-top:18px; border:1px solid var(--line); border-radius:18px; padding:18px; }
.big-number { font-size:42px; font-weight:900; letter-spacing:-.03em; }
.adjust-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:14px; }
.variance { border-radius:14px; padding:14px; background:#f9fafb; margin-top:12px; display:flex; justify-content:space-between; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:#111827; color:#fff; padding:12px 16px; border-radius:12px; font-weight:700; transition:.2s ease; z-index:20; }
.toast.show { transform:translateX(-50%) translateY(0); }
@media (max-width: 760px) {
  .app-shell { padding:12px; }
  .topbar { align-items:flex-start; }
  .topbar h1 { font-size:24px; }
  .top-actions { width: 48%; }
  .top-actions select { min-width:0; width:100%; }
  .action-grid { grid-template-columns:1fr; }
  .action-card { min-height:104px; padding:16px; grid-template-columns:52px 1fr auto; }
  .action-card h3 { font-size:20px; }
  .hero-card { padding:18px; }
  .hero-card h2 { font-size:24px; }
  .panel { padding:16px; border-radius:16px; }
  .scan-row { grid-template-columns:1fr; }
  .scan-row button { min-height:54px; }
  .quick-po { grid-template-columns:1fr; gap:4px; }
  .two-col, .adjust-grid { grid-template-columns:1fr; }
  .line-item { grid-template-columns:1fr; }
  .summary-bar { position:sticky; bottom:8px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; justify-content:space-between; box-shadow:var(--shadow); }
  .activity-item { grid-template-columns:74px 1fr; }
  .activity-item > :last-child { grid-column:2; }
}

<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">BARGAIN MOULDING</div>
        <h1 id="pageTitle">Warehouse</h1>
      </div>
      <div class="top-actions">
        <select id="locationSelect" aria-label="Current warehouse"></select>
        <button class="icon-btn" id="homeBtn" title="Home">⌂</button>
      </div>
    </header>

    <div id="employeeBar" class="employee-bar hidden"></div><main id="app"></main>
  </div>

  <template id="loginTemplate">
    <section class="login-shell"><div class="login-card"><div class="eyebrow">EMPLOYEE TIME CLOCK</div><h2>Clock in to Bargain Warehouse</h2><p class="muted">Enter your employee PIN. Prototype PINs: 1234 warehouse, 2468 manager, 1111 driver.</p><div id="pinDisplay" class="pin-display">----</div><div class="pin-grid" id="pinGrid"></div><button id="pinClear" class="secondary">Clear</button><p class="permission-note">Prototype only — PINs are not secure credentials yet.</p></div></section>
  </template>

  <template id="clockTemplate">
    <section class="login-shell"><div class="login-card"><div class="eyebrow">WELCOME</div><h2 id="clockEmployee"></h2><p class="muted">Choose where you are working today. Location verification can be recorded later without hard-blocking the employee.</p><label>Work location</label><select id="clockLocation" style="width:100%;margin:8px 0 18px"></select><button id="clockInBtn" class="primary" style="width:100%;padding:16px">CLOCK IN & OPEN WAREHOUSE</button></div></section>
  </template>

  <template id="homeTemplate">
    <section class="hero-card">
      <div>
        <div class="eyebrow">CURRENT LOCATION</div>
        <h2 id="homeLocation"></h2>
        <p class="muted">Scan-first warehouse control from receiving through final pickup or truck load.</p>
      </div>
      <div class="status-pill">Prototype</div>
    </section>

    <section class="panel"><div class="clock-card"><div><div class="eyebrow">TIME CLOCK</div><h3 id="clockStatus">Clocked in</h3><p class="muted" id="clockDetail"></p></div><button id="clockOutBtn" class="secondary">Clock Out</button></div></section>

    <section class="action-grid">
      <button class="action-card receive" data-route="receive">
        <div class="action-icon">▣</div>
        <div>
          <h3>Receive PO</h3>
          <p>Receive incoming purchase orders</p>
        </div>
        <span>›</span>
      </button>
      <button class="action-card transfer" data-route="transfer">
        <div class="action-icon">⇄</div>
        <div>
          <h3>Move Material</h3>
          <p>Create warehouse transfers</p>
        </div>
        <span>›</span>
      </button>
      <button class="action-card adjust" data-route="adjust">
        <div class="action-icon">±</div>
        <div>
          <h3>Fix Inventory</h3>
          <p>Correct on-hand quantities</p>
        </div>
        <span>›</span>
      </button>

      <button class="action-card pick" data-route="pickpack">
        <div class="action-icon">✓▣</div>
        <div>
          <h3>Will Call Pick &amp; Pack</h3>
          <p>Pick and stage In Store / Will Call orders</p>
        </div>
        <span>›</span>
      </button>
      <button class="action-card transfer" data-route="fulfillment">
        <div class="action-icon">🚚</div>
        <div>
          <h3>Load Delivery</h3>
          <p>Final barcode check for delivery orders only</p>
        </div>
        <span>›</span>
      </button>
      <button class="action-card admin-card" id="adminDashboardBtn">
        <div class="action-icon">▦</div>
        <div>
          <h3>Admin Dashboard</h3>
          <p>Adjustments, loss and warehouse activity</p>
        </div>
        <span>›</span>
      </button>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <div class="eyebrow">ACTIVITY</div>
          <h3>Recent warehouse actions</h3>
        </div>
      </div>
      <div id="activityList" class="activity-list"></div>
    </section>
  </template>

  <template id="receiveTemplate">
    <section class="panel compact">
      <div class="section-head">
        <div>
          <div class="eyebrow">RECEIVING</div>
          <h2>Find a purchase order</h2>
        </div>
      </div>
      <div class="scan-row">
        <input id="poSearch" class="scan-input" placeholder="Scan or enter PO number" autocomplete="off" />
        <button id="poSearchBtn" class="primary">Find PO</button>
      </div>
      <div class="quick-list">
        <button class="quick-po" data-po="5485">
          <strong>PO 5485</strong><span>J&amp;O Doors · Received Some</span><span>730 Windham Rd · 32 remaining</span>
        </button>
        <button class="quick-po" data-po="5505">
          <strong>PO 5505</strong><span>Carter Millwork</span><span>336 Bayview</span>
        </button>
      </div>
    </section>

    <section id="receiveWork" class="panel hidden"></section>
  </template>

  <template id="transferHubTemplate">
    <section class="panel">
      <div class="section-head"><div><div class="eyebrow">TRANSFERS</div><h2>What are you doing?</h2><p class="muted" style="margin:6px 0 0">Create a new transfer, or scan paperwork for a transfer already written in Qoblex.</p></div></div>

const locationSelect = document.getElementById('locationSelect');

function init() {

  locationSelect.addEventListener('change', e => { state.location = e.target.value; render(); });

}

function go(route) { state.route = route; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function cloneTemplate(id) { return document.getElementById(id).content.cloneNode(true); }

function render() {
  app.innerHTML = '';
  const bar=document.getElementById('employeeBar');
  if(state.employee){bar.classList.remove('hidden');bar.innerHTML=`<span class="employee-chip">${state.employee.name}</span><span class="employee-chip">${state.employee.role}</span>${state.clockedIn?`<span class="employee-chip clocked">● CLOCKED IN · ${state.location}</span>`:''}<button class="logout-btn" id="logoutBtn">Sign out</button>`;setTimeout(()=>{const b=document.getElementById('logoutBtn');if(b)b.onclick=logout},0)}else bar.classList.add('hidden');
  locationSelect.style.display=state.clockedIn?'block':'none'; homeBtn.style.display=state.clockedIn?'block':'none';
  if (state.route === 'login') return renderLogin();
  if (state.route === 'clock') return renderClock();
  if (state.route === 'home') renderHome();
  if (state.route === 'receive') renderReceive();
  if (state.route === 'transfer') renderTransferHub();
  if (state.route === 'transferCreate') renderTransferCreate();
  if (state.route === 'transferCheck') renderTransferCheck();
  if (state.route === 'adjust') renderAdjust();
  if (state.route === 'pickpack') renderPickPackHub();
  if (state.route === 'pick') renderPick();
  if (state.route === 'pack') renderPack();
  if (state.route === 'fulfillment') renderLoadCheck();
  if (state.route === 'willcall') renderWillCall();
  if (state.route === 'loadcheck') renderLoadCheck();
  if (state.route === 'admin') renderAdmin();
}

function renderLogin(){pageTitle.textContent='Employee Login';app.appendChild(cloneTemplate('loginTemplate'));let pin='';const d=document.getElementById('pinDisplay');const draw=()=>d.textContent=pin?('•'.repeat(pin.length)):'----';const grid=document.getElementById('pinGrid');[1,2,3,4,5,6,7,8,9,0].forEach(n=>{const b=document.createElement('button');b.className='pin-key';b.textContent=n;b.onclick=()=>{if(pin.length<4){pin+=n;draw();if(pin.length===4){const emp=employees[pin];if(emp){state.employee={...emp};state.route='clock';render()}else{notify('PIN not recognized');pin='';setTimeout(draw,250)}}}};grid.appendChild(b)});document.getElementById('pinClear').onclick=()=>{pin='';draw()}}

function logout(){state.employee=null;state.clockedIn=false;state.clockInTime=null;state.route='login';render()}
function clockOut(){state.clockedIn=false;state.clockInTime=null;state.route='clock';render();notify('Clocked out')}

function renderHome() {
  if(!state.clockedIn){state.route='clock';return render()}

  document.getElementById('clockDetail').textContent=`${state.location} · since ${state.clockInTime.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`;

  document.querySelectorAll('[data-route]').forEach(btn => {if(!state.employee.permissions.includes(btn.dataset.route)){btn.style.display='none'}else btn.addEventListener('click', () => go(btn.dataset.route))});
  const adminBtn=document.getElementById('adminDashboardBtn'); if(adminBtn){ if(!state.employee.permissions.includes('admin')) adminBtn.style.display='none'; else adminBtn.onclick=()=>go('admin'); }

function showPO(num) {
  const po = purchaseOrders[num];

  const orderedTotal=()=>po.lines.reduce((s,l)=>s+l.ordered,0);
  const receivedTotal=()=>po.lines.reduce((s,l)=>s+l.received,0);
  const remainingTotal=()=>po.lines.reduce((s,l)=>s+Math.max(0,l.ordered-l.received),0);
  const nowTotal=()=>po.lines.reduce((s,l)=>s+l.now,0);

  work.innerHTML = `
    <div class="po-meta">
      <strong>PO ${num}</strong><span>${po.supplier}</span><span>Supplier Ref ${po.supplierRef||'—'}</span><span class="status-pill">${po.status}</span>

      <div class="kpi"><span class="muted">Ordered</span><strong>${orderedTotal()}</strong><span class="tiny">pieces</span></div>
      <div class="kpi"><span class="muted">Previously received</span><strong id="kpiReceived">${receivedTotal()}</strong><span class="tiny">pieces</span></div>
      <div class="kpi"><span class="muted">Remaining</span><strong id="kpiRemaining">${remainingTotal()}</strong><span class="tiny">pieces</span></div>
      <div class="kpi"><span class="muted">This receipt</span><strong id="kpiNow">0</strong><span class="tiny">good pieces</span></div>
    </div>
    <div class="scan-row">
      <input id="receiveScan" class="scan-input" placeholder="Scan item barcode — each scan = 1 piece" autocomplete="off" />
      <button id="receiveScanBtn" class="primary">Add scan</button>
    </div>
    <div class="warning-box">Receive the good material. If there is a problem with the delivery, report it below. Extra pieces require manager approval.</div>

    <div id="exceptionEditor"></div>
    <div class="receive-footer">
      <div class="totals"><div><span class="muted">Good Pieces This Receipt</span><strong id="receiveTotal">0</strong></div><div><span class="muted">Problems</span><strong id="exceptionCount">0</strong></div></div>
      <button id="confirmReceipt" class="success">Finish Receiving</button>
    </div>`;

  function requestOverageApproval(line, requestedQty, afterApprove){
    if(state.employee.role==='Manager') { line.overageApproved=true; notify('Manager approval applied for extra pieces'); return afterApprove(); }
    const overlay=document.createElement('div'); overlay.className='approval-overlay';
    overlay.innerHTML=`<div class="approval-card"><div class="eyebrow">MANAGER APPROVAL</div><h3>Extra pieces?</h3><p class="muted">${line.name}</p><p>Remaining on PO: <strong>${Math.max(0,line.ordered-line.received)}</strong> · Requested this receipt: <strong>${requestedQty}</strong></p><input id="managerPin" type="password" inputmode="numeric" maxlength="4" placeholder="Manager PIN"/><div style="display:flex;gap:10px"><button id="cancelApproval" class="secondary" style="flex:1">Cancel</button><button id="approveOverage" class="danger" style="flex:1">Approve Extra Pieces</button></div><p class="permission-note">Prototype manager PIN: 2468</p></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#cancelApproval').onclick=()=>overlay.remove();
    overlay.querySelector('#approveOverage').onclick=()=>{ if(overlay.querySelector('#managerPin').value==='2468'){line.overageApproved=true;overlay.remove();notify('Extra pieces approved');afterApprove();} else notify('Manager PIN not recognized'); };
    setTimeout(()=>overlay.querySelector('#managerPin').focus(),50);
  }

  function setQty(line,newQty){
    newQty=Math.max(0,Number(newQty)||0);
    const remaining=Math.max(0,line.ordered-line.received);
    if(newQty>remaining && !line.overageApproved) return requestOverageApproval(line,newQty,()=>{line.now=newQty;draw();});
    line.now=newQty; draw();
  }

  function addIssue(line){
    const editor=document.getElementById('exceptionEditor');
    editor.innerHTML=`<div class="exception-panel"><div class="eyebrow">DELIVERY PROBLEM</div><h3>${line.name}</h3><div class="exception-grid"><select id="issueType"><option>Short</option><option>Damaged</option><option>Wrong Item</option><option>Other</option></select><input id="issueQty" type="number" min="1" value="1" inputmode="numeric" placeholder="Qty"><textarea id="issueNote" placeholder="Optional note — what happened?"></textarea></div><div class="photo-box"><strong>Photo (optional)</strong><div class="tiny">On iPhone this can open the camera.</div><input id="issuePhoto" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photo-preview hidden" alt="Problem photo preview"></div><div style="display:flex;gap:10px;margin-top:12px"><button id="cancelIssue" class="secondary">Cancel</button><button id="saveIssue" class="primary">Save Problem</button></div></div>`;
    const fileInput=document.getElementById('issuePhoto');
    fileInput.onchange=()=>{const f=fileInput.files[0];const img=document.getElementById('photoPreview');if(f){img.src=URL.createObjectURL(f);img.classList.remove('hidden')}};
    document.getElementById('cancelIssue').onclick=()=>editor.innerHTML='';
    document.getElementById('saveIssue').onclick=()=>{const qty=Math.max(1,Number(document.getElementById('issueQty').value)||1);const f=fileInput.files[0];line.issues.push({type:document.getElementById('issueType').value,qty,note:document.getElementById('issueNote').value.trim(),photo:f?f.name:null});editor.innerHTML='';notify('Problem saved');draw();};
    editor.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function draw(){
    const list=document.getElementById('receiveLines');
    list.innerHTML=po.lines.map(l=>{const remaining=Math.max(0,l.ordered-l.received);const cls=remaining===0?'complete':l.received>0?'partial':'';return `<div class="receive-line ${cls}">
      <div><div class="name">${l.name}</div><div class="muted">SKU ${l.sku} · Barcode ${l.barcode}</div>${remaining===0?'<div class="tiny clocked">✓ PO line already complete</div>':''}</div>
      <div class="metric"><small>Ordered</small><strong>${l.ordered}</strong></div>
      <div class="metric"><small>Received</small><strong>${l.received}</strong></div>
      <div class="metric"><small>Remaining</small><strong>${remaining}</strong></div>
      <div><small class="muted">Good now</small><div class="qty-box"><button data-minus="${l.id}">−</button><input data-qty="${l.id}" value="${l.now}" inputmode="numeric"><button data-plus="${l.id}">+</button></div></div>
      <button class="issue-btn" data-issue="${l.id}">⚠ Report a Problem</button>
      ${l.issues.length?`<div class="issue-list">${l.issues.map((x,idx)=>`<div class="issue-chip"><strong>${x.type}</strong><span>Qty ${x.qty}</span>${x.note?`<span>${x.note}</span>`:''}${x.photo?`<span>📷 ${x.photo}</span>`:''}<button class="secondary" data-delissue="${l.id}:${idx}" style="min-height:32px;padding:0 8px">Remove</button></div>`).join('')}</div>`:''}
    </div>`}).join('');
    document.getElementById('receiveTotal').textContent=nowTotal();document.getElementById('kpiNow').textContent=nowTotal();document.getElementById('exceptionCount').textContent=po.lines.reduce((s,l)=>s+l.issues.length,0);
    document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const l=po.lines.find(x=>x.id==b.dataset.plus);setQty(l,l.now+1)});
    document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const l=po.lines.find(x=>x.id==b.dataset.minus);setQty(l,Math.max(0,l.now-1))});
    document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{const l=po.lines.find(x=>x.id==i.dataset.qty);setQty(l,i.value)});
    document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>addIssue(po.lines.find(x=>x.id==b.dataset.issue)));
    document.querySelectorAll('[data-delissue]').forEach(b=>b.onclick=()=>{const [id,idx]=b.dataset.delissue.split(':');const l=po.lines.find(x=>x.id==id);l.issues.splice(Number(idx),1);draw()});
  }
  draw();

  const scanInput=document.getElementById('receiveScan');
  const scan=()=>{const code=scanInput.value.trim();const line=po.lines.find(l=>l.barcode===code||l.sku===code);if(!line){notify('Barcode is not on this PO');scanInput.select();return;}const next=line.now+1;const remaining=Math.max(0,line.ordered-line.received);if(next>remaining&&!line.overageApproved){requestOverageApproval(line,next,()=>{line.now=next;draw();});}else{line.now=next;notify(`${line.sku} +1`);draw();}scanInput.value='';scanInput.focus();};
  document.getElementById('receiveScanBtn').onclick=scan; scanInput.onkeydown=e=>{if(e.key==='Enter')scan()};

  document.getElementById('confirmReceipt').onclick=()=>{
    const total=nowTotal();const issueCount=po.lines.reduce((s,l)=>s+l.issues.length,0);
    if(!total&&!issueCount)return notify('Nothing to finish');
    const txLines=po.lines.filter(l=>l.now>0||l.issues.length).map(l=>({sku:l.sku,name:l.name,qty:l.now,problems:l.issues.map(x=>({...x}))}));
    po.lines.forEach(l=>{l.received+=l.now;l.now=0;l.issues=[];});
    po.status=receivedTotal()>=orderedTotal()?'Received':'Received Some';
    const ref=`RCV-${num}-${String(Date.now()).slice(-5)}`;
    const tx={type:'Receiving',ref,po:num,supplier:po.supplier,location:po.shipTo,employee:state.employee?.name||'Employee',date:new Date(),lines:txLines,total,issueCount,status:po.status};
    state.activity.unshift({type:'RECEIVE',text:`${total} good pieces received on PO ${num} into ${po.shipTo}${issueCount?` · ${issueCount} problem${issueCount>1?'s':''}`:''}`,ref});
    showCompletion(tx,'receive');
  };
  work.scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>scanInput.focus(),200);
}

function renderTransferCreate() {
  pageTitle.textContent = 'Create Transfer';
  app.appendChild(cloneTemplate('transferCreateTemplate'));
  let from = state.location;
  const fromSelect = document.getElementById('transferFrom');
  const to = document.getElementById('transferTo');
  const updateLocations=()=>{from=fromSelect.value;to.innerHTML=warehouses.filter(w=>w!==from).map(w=>`<option>${w}</option>`).join('')};
  fromSelect.innerHTML=warehouses.map(w=>`<option ${w===from?'selected':''}>${w}</option>`).join('');
  updateLocations();
  const input = document.getElementById('transferSku');
  fromSelect.onchange=()=>{if(state.transferItems.length&&!confirm('Changing the Move From warehouse will clear the scanned material. Continue?')){fromSelect.value=from;return}state.transferItems=[];state.location=fromSelect.value;locationSelect.value=state.location;updateLocations();drawTransfer();input.value='';input.focus();notify(`Move From changed to ${from}`)};
  const add = () => {
    const p=findProductByScan(input.value);
    if(!p) { notify('Material not found'); input.select(); return; }
    const existing=state.transferItems.find(x=>x.sku===p.sku);
    const current=existing?existing.qty:0;
    if(current+1>p.onHand){ notify(`Only ${p.onHand} pieces available at ${from}`); input.value=''; input.focus(); return; }
    if(existing) existing.qty++; else state.transferItems.push({...p, qty:1});
    input.value=''; drawTransfer(); input.focus();
  };
  document.getElementById('transferAdd').onclick=add;
  input.onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.getElementById('createTransfer').onclick=()=>{
    if(!state.transferItems.length) return;
    if(!to.value) return notify('Choose where the material is moving to');
    const items=state.transferItems.map(i=>({...i}));
    const invalid=items.find(i=>i.qty>i.onHand);
    if(invalid) return notify(`${invalid.sku} is above available inventory`);
    const units=items.reduce((sum,i)=>sum+i.qty,0);
    const ref='TR-'+String(Math.floor(Math.random()*900000+100000));
    const note=document.getElementById('transferNote').value.trim();
    const tx={type:'Transfer',ref,from,to:to.value,location:from,employee:state.employee?.name||'Employee',date:new Date(),lines:items,total:units,note,status:'Ready to Move'};
    state.activity.unshift({type:'TRANSFER', text:`${units} pieces moving from ${from} to ${to.value}`, ref});
    state.transferItems=[]; showCompletion(tx,'transfer');
  };
  drawTransfer();
  setTimeout(()=>input.focus(),150);
}

function drawTransfer() {
  const list=document.getElementById('transferItems'); if(!list) return;
  list.innerHTML=state.transferItems.length ? state.transferItems.map((i,idx)=>{
    const after=Math.max(0,i.onHand-i.qty);
    return `<div class="receive-line ${i.qty>0?'partial':''}">
      <div><div class="eyebrow">${esc(i.sku)}</div><div class="name">${esc(i.name)}</div><div class="tiny">Barcode ${esc(i.barcode||i.sku)}</div></div>
      <div class="metric"><small>Available</small><strong>${i.onHand.toLocaleString()}</strong></div>
      <div class="metric"><small>Moving</small><strong>${i.qty.toLocaleString()}</strong></div>
      <div class="metric"><small>Left Here</small><strong>${after.toLocaleString()}</strong></div>
      <div class="qty-box"><button data-tminus="${idx}">−</button><input data-tqty="${idx}" value="${i.qty}" inputmode="numeric"><button data-tplus="${idx}">+</button></div>
      <button class="secondary" data-remove="${idx}">Remove</button>
    </div>`;
  }).join('') : '<div style="padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px"><strong>No material scanned yet</strong><p class="muted" style="margin-bottom:0">Scan the first piece to start this transfer.</p></div>';
  const count=state.transferItems.length;
  const units=state.transferItems.reduce((sum,i)=>sum+i.qty,0);
  document.getElementById('transferCount').textContent=count;
  document.getElementById('transferUnits').textContent=units;
  document.getElementById('createTransfer').disabled=!count;
  document.querySelectorAll('[data-tplus]').forEach(b=>b.onclick=()=>{const i=state.transferItems[Number(b.dataset.tplus)];if(i.qty>=i.onHand)return notify(`Only ${i.onHand} pieces available`);i.qty++;drawTransfer();});
  document.querySelectorAll('[data-tminus]').forEach(b=>b.onclick=()=>{const i=state.transferItems[Number(b.dataset.tminus)];if(i.qty>1)i.qty--;drawTransfer();});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.transferItems.splice(Number(b.dataset.remove),1);drawTransfer();});
  document.querySelectorAll('[data-tqty]').forEach(inp=>inp.onchange=()=>{const i=state.transferItems[Number(inp.dataset.tqty)];let q=Math.max(1,Number(inp.value)||1);if(q>i.onHand){q=i.onHand;notify(`Set to available quantity: ${i.onHand}`);}i.qty=q;drawTransfer();});
}

function showTransferCheck(ref){
  const base=backendTransfers[normalizeTransferRef(ref)];
  if(!base) return notify('Transfer not found in prototype');
  const tx={...base,lines:base.lines.map(l=>({...l,scanned:0})),problems:[]};
  const work=document.getElementById('transferCheckWork');
  work.classList.remove('hidden');
  const expectedTotal=tx.lines.reduce((s,l)=>s+l.expected,0);
  work.innerHTML=`
    <div class="po-meta"><strong>${esc(tx.ref)}</strong><span>${esc(tx.from)} → ${esc(tx.to)}</span><span class="status-pill">${esc(tx.status)}</span><span>Written by ${esc(tx.createdBy)}</span></div>
    <div class="transfer-header-grid">
      <div class="kpi"><span class="muted">Item Lines</span><strong>${tx.lines.length}</strong></div>
      <div class="kpi"><span class="muted">Expected Pieces</span><strong>${expectedTotal}</strong></div>
      <div class="kpi"><span class="muted">Scanned</span><strong id="checkScanned">0</strong></div>
      <div class="kpi"><span class="muted">Still Needed</span><strong id="checkRemaining">${expectedTotal}</strong></div>
    </div>
    <div class="scan-row">
      <input id="checkItemScan" class="scan-input" placeholder="Scan material barcode — each scan = 1 piece" autocomplete="off" />
      <button id="checkItemBtn" class="primary">Check Piece</button>
    </div>
    <div id="scanFeedback" class="scan-feedback warn">Scan the first piece on the paperwork.</div>
    <div id="checkLines" class="line-list"></div>
    <div class="receive-footer">
      <div class="totals"><div><span class="muted">Lines Complete</span><strong id="checkComplete">0/${tx.lines.length}</strong></div><div><span class="muted">Problems</span><strong id="checkProblems">0</strong></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button id="finishWithProblem" class="danger">Finish With Problem</button><button id="finishCheck" class="success" disabled>Finish Transfer Check</button></div>
    </div>`;
  const scan=document.getElementById('checkItemScan');
  const feedback=document.getElementById('scanFeedback');
  const scanPiece=()=>{
    const q=String(scan.value||'').trim().toUpperCase();
    if(!q) return;
    const line=tx.lines.find(l=>String(l.sku).toUpperCase()===q||String(l.barcode).toUpperCase()===q);
    if(!line){
      feedback.className='scan-feedback stop';
      feedback.innerHTML=`⛔ NOT ON THIS TRANSFER — <strong>${esc(q)}</strong>. Do not load this material.`;
      tx.problems.push({type:'Wrong Item',value:q,time:new Date()});
      scan.value=''; drawCheck(); scan.focus(); return;
    }
    if(line.scanned>=line.expected){
      feedback.className='scan-feedback stop';
      feedback.innerHTML=`⚠️ EXTRA PIECE — ${esc(line.sku)} calls for <strong>${line.expected}</strong>. You already scanned ${line.scanned}.`;
      tx.problems.push({type:'Extra Piece',value:line.sku,time:new Date()});
      scan.value=''; drawCheck(); scan.focus(); return;
    }
    line.scanned++;
    feedback.className='scan-feedback ok';
    feedback.innerHTML=`✓ Correct item — <strong>${esc(line.sku)}</strong> ${line.scanned}/${line.expected} scanned.`;
    scan.value=''; drawCheck(); scan.focus();
  };
  document.getElementById('checkItemBtn').onclick=scanPiece;
  scan.onkeydown=e=>{if(e.key==='Enter')scanPiece();};
  document.getElementById('finishWithProblem').onclick=()=>finishCheckedTransfer(tx,true);
  document.getElementById('finishCheck').onclick=()=>finishCheckedTransfer(tx,false);
  function drawCheck(){
    const list=document.getElementById('checkLines');
    list.innerHTML=tx.lines.map(l=>{
      const remain=l.expected-l.scanned;
      const cls=remain===0?'good':l.scanned>0?'need':'';
      return `<div class="match-line ${cls}"><div><div class="eyebrow">${esc(l.sku)}</div><div class="name">${esc(l.name)}</div><div class="tiny">Barcode ${esc(l.barcode)}</div></div><div class="metric"><small>Expected</small><strong>${l.expected}</strong></div><div class="metric"><small>Scanned</small><strong>${l.scanned}</strong></div><div class="metric"><small>${remain===0?'Status':'Still Needed'}</small><strong>${remain===0?'✓ Complete':remain}</strong></div></div>`;
    }).join('');
    const scanned=tx.lines.reduce((s,l)=>s+l.scanned,0), remaining=expectedTotal-scanned, complete=tx.lines.filter(l=>l.scanned===l.expected).length;
    document.getElementById('checkScanned').textContent=scanned;
    document.getElementById('checkRemaining').textContent=remaining;
    document.getElementById('checkComplete').textContent=`${complete}/${tx.lines.length}`;
    document.getElementById('checkProblems').textContent=tx.problems.length;
    document.getElementById('finishCheck').disabled=remaining!==0;
  }
  drawCheck();
  work.scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>scan.focus(),180);
}

async function finishCheckedTransfer(tx,withProblem){
  const expected=tx.lines.reduce((s,l)=>s+l.expected,0), scanned=tx.lines.reduce((s,l)=>s+l.scanned,0), missing=expected-scanned;
  if(!withProblem && missing>0) return notify(`${missing} pieces still need to be scanned`);
  if(withProblem && missing===0 && !tx.problems.length) return notify('Everything matches — use Finish Transfer Check');
  let note='';
  if(withProblem){note=window.prompt('What is wrong with this transfer? Example: 2 pieces short, damaged, wrong item.')||''; if(!note.trim()) return notify('Add a problem note before finishing');}
  const finish=document.getElementById('finishCheck'),problem=document.getElementById('finishWithProblem');
  finish.disabled=true;problem.disabled=true;const prior=withProblem?problem.textContent:finish.textContent;(withProblem?problem:finish).textContent='Saving in BM Warehouse…';
  try{
    const token=await window.bmGoogleAuth.accessToken();
    if(!token)throw new Error('Your session expired. Refresh and sign in again.');
    const response=await fetch('/api/warehouse?action=finish-transfer-check',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({transferNumber:tx.ref,withProblem,problemNote:note,lines:tx.lines.map(l=>({id:l.id,sku:l.sku,receivedQty:l.scanned,note:l.expected===l.scanned?'':note})),problems:tx.problems.map(p=>({type:p.type,value:p.value,quantity:1,note}))})});
    const data=await response.json().catch(()=>null);
    if(!response.ok)throw new Error(data?.error||'The transfer count could not be saved.');
    const completed={type:'Transfer Check',ref:tx.ref,from:tx.from,to:tx.to,location:tx.to,employee:state.employee?.name||'Manager',date:new Date(),lines:tx.lines.map(l=>({sku:l.sku,name:l.name,qty:l.scanned,expected:l.expected})),total:scanned,expectedTotal:expected,missing,problems:tx.problems,note,status:withProblem?'Problem — Logistics Review':'Completed',serverRecorded:true,shadowMode:Boolean(data.shadowMode),inventoryPosted:Boolean(data.inventoryPosted),qoblexTransferId:null};
    state.activity.unshift({type:'TRANSFER',text:`${tx.ref} checked by ${completed.employee} · ${withProblem?'problem reported':'all pieces match'}`,ref:tx.ref});
    showTransferCheckCompletion(completed);
  }catch(error){
    notify(error.message);problem.disabled=false;finish.disabled=missing!==0;(withProblem?problem:finish).textContent=prior;
  }
}

function showTransferCheckCompletion(tx){
  pageTitle.textContent='Transfer Check Complete';
  const rows=tx.lines.map(l=>`<tr><td><strong>${esc(l.sku)}</strong><br><span class="muted">${esc(l.name)}</span></td><td>${l.expected}</td><td>${l.qty}</td><td>${l.expected-l.qty}</td></tr>`).join('');
  app.innerHTML=`<section class="completion-card"><div class="completion-icon">✓</div><div class="eyebrow" style="margin-top:14px">${tx.status==='Checked — Matches'?'TRANSFER MATCHED':'PROBLEM REPORTED'}</div><h2>${esc(tx.ref)}</h2><p class="muted">Checked by ${esc(tx.employee)} · ${fmtDate(tx.date)}</p>${tx.shadowMode?'<div class="scan-feedback warn"><strong>SHADOW MODE:</strong> Recorded in BM Warehouse only. Inventory was not posted to Qoblex or Shopify.</div>':''}<div class="ticket-preview"><div class="ticket-head"><div><strong>Move From:</strong> ${esc(tx.from)}</div><div><strong>Move To:</strong> ${esc(tx.to)}</div><div><strong>Status:</strong> ${esc(tx.status)}</div>${tx.note?`<div><strong>Problem:</strong> ${esc(tx.note)}</div>`:''}</div><table><thead><tr><th>Material</th><th>Expected</th><th>Scanned</th><th>Missing</th></tr></thead><tbody>${rows}</tbody></table></div><div class="completion-actions"><button id="printCheck" class="print-btn">🖨 Print</button><button id="doneCheck" class="primary">Done</button></div></section>`;
  document.getElementById('printCheck').onclick=()=>printTransferCheck(tx);
  document.getElementById('doneCheck').onclick=()=>go('transferCheck');
}

function printTransferCheck(tx){
  let body=`<h1>Bargain Moulding — Transfer Check</h1><div class="muted">${esc(tx.ref)} · ${fmtDate(tx.date)}</div><div class="meta"><div><strong>Checked By</strong><br>${esc(tx.employee)}</div><div><strong>Status</strong><br>${esc(tx.status)}</div><div><strong>Move From</strong><br>${esc(tx.from)}</div><div><strong>Move To</strong><br>${esc(tx.to)}</div><div><strong>Expected Pieces</strong><br>${tx.expectedTotal}</div><div><strong>Scanned Pieces</strong><br>${tx.total}</div>${tx.note?`<div><strong>Problem Note</strong><br>${esc(tx.note)}</div>`:''}</div><table><thead><tr><th>SKU</th><th>Description</th><th>Expected</th><th>Scanned</th><th>Missing</th></tr></thead><tbody>${tx.lines.map(l=>`<tr><td>${esc(l.sku)}</td><td>${esc(l.name)}</td><td>${l.expected}</td><td>${l.qty}</td><td>${l.expected-l.qty}</td></tr>`).join('')}</tbody></table><div class="sig"><div class="line">Warehouse Manager Signature</div><div class="line">Receiver / Driver</div></div>`;
  printWindow(`Transfer Check ${tx.ref}`,body);
}

function buildVerifyWork(work,tx,mode){

    <div id="verifyLines" class="line-list"></div>
    <div class="receive-footer">
      <div class="totals"><div><span class="muted">Lines Complete</span><strong id="verifyComplete">0/${tx.lines.length}</strong></div><div><span class="muted">Problems Caught</span><strong id="verifyProblems">0</strong></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button id="verifyProblem" class="danger">Finish With Problem</button><button id="verifyFinish" class="success" disabled>${action}</button></div>
    </div>`;
  const scan=document.getElementById('verifyItemScan');
  const feedback=document.getElementById('verifyFeedback');
  const scanPiece=()=>{
    const q=String(scan.value||'').trim().toUpperCase(); if(!q)return;
    const line=tx.lines.find(l=>String(l.sku).toUpperCase()===q||String(l.barcode).toUpperCase()===q);

    if(line.scanned>=line.expected){feedback.className='scan-feedback stop';feedback.innerHTML=`⚠️ EXTRA PIECE — ${esc(line.sku)} calls for <strong>${line.expected}</strong>. You already scanned ${line.scanned}.`;tx.problems.push({type:'Extra Piece',value:line.sku,time:new Date()});scan.value='';draw();scan.focus();return;}
    line.scanned++;feedback.className='scan-feedback ok';feedback.innerHTML=`✓ Correct item — <strong>${esc(line.sku)}</strong> ${line.scanned}/${line.expected} scanned.`;scan.value='';draw();scan.focus();
  };
  document.getElementById('verifyItemBtn').onclick=scanPiece;

function finishVerify(tx,mode,withProblem){

      p.onHand=newQty;
      const ref='ADJ-'+String(Math.floor(Math.random()*900000+100000));
      const tx={type:'Adjustment',ref,location:state.location,employee:state.employee?.name||'Employee',date:new Date(),sku:p.sku,name:p.name,oldQty:old,newQty,variance,reason,unitCost:p.cost,costImpact,approvedBy,lines:[{sku:p.sku,name:p.name,qty:Math.abs(variance)}]};
      adjustmentLog.unshift({ref,date:tx.date,warehouse:state.location,employee:tx.employee,sku:p.sku,name:p.name,oldQty:old,newQty,difference:variance,reason,unitCost:p.cost,approvedBy});
      state.activity.unshift({type:'ADJUST', text:`${p.sku} corrected from ${old.toLocaleString()} to ${newQty.toLocaleString()} (${variance>=0?'+':''}${variance}) · ${costImpact<0?'loss ':'value '} $${Math.abs(costImpact).toFixed(2)}`, ref});
      showCompletion(tx,'adjust');
    };
    if(Math.abs(costImpact)>=250 && state.employee.role!=='Manager'){
      const overlay=document.createElement('div'); overlay.className='approval-overlay';
      overlay.innerHTML=`<div class="approval-card"><div class="eyebrow">MANAGER APPROVAL</div><h3>Large adjustment</h3><p>${esc(p.sku)} · ${variance>=0?'+':''}${variance} pieces</p><p>Cost impact: <strong>${costImpact<0?'-':'+'}$${Math.abs(costImpact).toFixed(2)}</strong></p><input id="adjustManagerPin" type="password" inputmode="numeric" maxlength="4" placeholder="Manager PIN"/><div style="display:flex;gap:10px"><button id="cancelAdjApproval" class="secondary" style="flex:1">Cancel</button><button id="approveAdjustment" class="danger" style="flex:1">Approve Adjustment</button></div><p class="permission-note">Prototype manager PIN: 2468</p></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#cancelAdjApproval').onclick=()=>overlay.remove();
      overlay.querySelector('#approveAdjustment').onclick=()=>{if(overlay.querySelector('#adjustManagerPin').value==='2468'){overlay.remove();finishAdjustment('Warehouse Manager');}else notify('Manager PIN not recognized');};
      setTimeout(()=>overlay.querySelector('#adjustManagerPin').focus(),50);
    } else finishAdjustment(state.employee.role==='Manager'?'Warehouse Manager':null);
  };
}

function money(v){return `${v<0?'-':''}$${Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function adjustmentValue(a){return a.difference*a.unitCost;}
function periodStart(period){const d=new Date(); if(period==='today'){d.setHours(0,0,0,0);return d;} if(period==='week'){d.setDate(d.getDate()-7);return d;} if(period==='month'){d.setDate(d.getDate()-30);return d;} return new Date(0);}
function renderAdmin(){
  if(!state.employee?.permissions.includes('admin')){notify('Manager access required');return go('home');}
  pageTitle.textContent='Admin Dashboard'; app.appendChild(cloneTemplate('adminTemplate'));
  const wh=document.getElementById('dashWarehouse'); wh.innerHTML='<option value="all">All Warehouses</option>'+warehouses.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
  const reasons=[...new Set(adjustmentLog.map(a=>a.reason))].sort(); document.getElementById('dashReason').innerHTML='<option value="all">All Reasons</option>'+reasons.map(r=>`<option>${esc(r)}</option>`).join('');
  const controls=['dashPeriod','dashWarehouse','dashReason','dashSearch']; controls.forEach(id=>{const el=document.getElementById(id); el.addEventListener(id==='dashSearch'?'input':'change',updateAdminDashboard);});
  document.getElementById('printAdjustReport').onclick=printAdjustmentReport; updateAdminDashboard();
}
function getFilteredAdjustments(){
  const period=document.getElementById('dashPeriod')?.value||'all'; const warehouse=document.getElementById('dashWarehouse')?.value||'all'; const reason=document.getElementById('dashReason')?.value||'all'; const q=(document.getElementById('dashSearch')?.value||'').trim().toLowerCase(); const start=periodStart(period);
  return adjustmentLog.filter(a=>new Date(a.date)>=start && (warehouse==='all'||a.warehouse===warehouse) && (reason==='all'||a.reason===reason) && (!q||a.sku.toLowerCase().includes(q)||a.employee.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)));
}
function updateAdminDashboard(){
  const rows=getFilteredAdjustments(); const removed=rows.filter(a=>a.difference<0); const added=rows.filter(a=>a.difference>0); const loss=removed.reduce((s,a)=>s+Math.abs(adjustmentValue(a)),0); const addedValue=added.reduce((s,a)=>s+adjustmentValue(a),0); const removedPieces=removed.reduce((s,a)=>s+Math.abs(a.difference),0); const addedPieces=added.reduce((s,a)=>s+a.difference,0);
  document.getElementById('dashboardKpis').innerHTML=`<div class="dash-kpi"><span class="muted">Adjustments</span><strong>${rows.length}</strong><span class="tiny">transactions</span></div><div class="dash-kpi loss"><span class="muted">Inventory Loss</span><strong>${money(loss)}</strong><span class="tiny">${removedPieces.toLocaleString()} pieces removed</span></div><div class="dash-kpi add"><span class="muted">Inventory Added</span><strong>${money(addedValue)}</strong><span class="tiny">${addedPieces.toLocaleString()} pieces added</span></div><div class="dash-kpi"><span class="muted">Net Cost Change</span><strong>${money(addedValue-loss)}</strong><span class="tiny">at Qoblex cost</span></div>`;
  const perWh=warehouses.map(w=>{const ar=rows.filter(a=>a.warehouse===w); const l=ar.filter(a=>a.difference<0).reduce((s,a)=>s+Math.abs(adjustmentValue(a)),0); const p=ar.filter(a=>a.difference<0).reduce((s,a)=>s+Math.abs(a.difference),0); return {w,l,p,n:ar.length};}).filter(x=>x.n).sort((a,b)=>b.l-a.l);
  document.getElementById('warehouseLossGrid').innerHTML=perWh.length?perWh.map(x=>`<button class="warehouse-loss-card" data-wh="${esc(x.w)}"><h4>${esc(x.w)}</h4><div class="loss-value">${money(x.l)}</div><div class="muted">inventory removed at cost</div><div class="mini"><span>${x.p} pieces removed</span><span>${x.n} adjustments</span></div></button>`).join(''):'<div class="muted">No adjustments match these filters.</div>';
  document.querySelectorAll('.warehouse-loss-card').forEach(b=>b.onclick=()=>{document.getElementById('dashWarehouse').value=b.dataset.wh;updateAdminDashboard();});
  const sorted=[...rows].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('adjustmentTable').innerHTML=sorted.length?`<table class="admin-table"><thead><tr><th>Date</th><th>Warehouse</th><th>Employee</th><th>SKU</th><th>Difference</th><th>Reason</th><th>Unit Cost</th><th>Cost Impact</th><th>Review</th></tr></thead><tbody>${sorted.map(a=>{const v=adjustmentValue(a); const flag=Math.abs(v)>=250||a.reason==='Missing'; return `<tr><td>${fmtDate(a.date)}</td><td>${esc(a.warehouse)}</td><td>${esc(a.employee)}</td><td><strong>${esc(a.sku)}</strong><br><span class="tiny">${esc(a.name)}</span></td><td>${a.difference>=0?'+':''}${a.difference}</td><td>${esc(a.reason)}</td><td>$${a.unitCost.toFixed(2)}</td><td class="${v<0?'money-loss':'money-add'}">${v>=0?'+':''}${money(v)}</td><td>${flag?'<span class="flag-badge">Review</span>':'—'}</td></tr>`}).join('')}</tbody></table>`:'<div style="padding:18px" class="muted">No adjustments match these filters.</div>';
}
function printAdjustmentReport(){
  const rows=getFilteredAdjustments(); const loss=rows.filter(a=>a.difference<0).reduce((s,a)=>s+Math.abs(adjustmentValue(a)),0); const add=rows.filter(a=>a.difference>0).reduce((s,a)=>s+adjustmentValue(a),0);
  let body=`<h1>Bargain Moulding — Inventory Adjustment Report</h1><div class="muted">Printed ${fmtDate(new Date())}</div><div class="meta"><div><strong>Adjustments</strong><br>${rows.length}</div><div><strong>Inventory Loss</strong><br>${money(loss)}</div><div><strong>Inventory Added</strong><br>${money(add)}</div><div><strong>Net Cost Change</strong><br>${money(add-loss)}</div></div><table><thead><tr><th>Date</th><th>Warehouse</th><th>Employee</th><th>SKU</th><th>Difference</th><th>Reason</th><th>Unit Cost</th><th>Cost Impact</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.warehouse)}</td><td>${esc(a.employee)}</td><td>${esc(a.sku)}</td><td>${a.difference>=0?'+':''}${a.difference}</td><td>${esc(a.reason)}</td><td>$${a.unitCost.toFixed(2)}</td><td>${money(adjustmentValue(a))}</td></tr>`).join('')}</tbody></table>`; printWindow('Inventory Adjustment Report',body);
}

function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function fmtDate(d){return new Date(d).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}
function showCompletion(tx,kind){
  pageTitle.textContent = kind==='receive'?'Receiving Complete':kind==='transfer'?'Transfer Complete':'Adjustment Complete';
  const lineRows=(tx.lines||[]).map(l=>`<tr><td><strong>${esc(l.sku||'')}</strong><br><span class="muted">${esc(l.name||'')}</span></td><td>${Number(l.qty||0).toLocaleString()}</td><td>${l.problems?.length?l.problems.map(p=>`${esc(p.type)} (${p.qty})`).join(', '):'—'}</td></tr>`).join('');
  const details = kind==='receive'
    ? `<div><strong>PO:</strong> ${esc(tx.po)} &nbsp; <strong>Supplier:</strong> ${esc(tx.supplier)}</div><div><strong>Location:</strong> ${esc(tx.location)} &nbsp; <strong>Status:</strong> ${esc(tx.status)}</div>`
    : kind==='transfer'
    ? `<div><strong>Move From:</strong> ${esc(tx.from)}</div><div><strong>Move To:</strong> ${esc(tx.to)}</div><div><strong>Status:</strong> ${esc(tx.status||'Ready to Move')}</div>${tx.note?`<div><strong>Note:</strong> ${esc(tx.note)}</div>`:''}`
    : `<div><strong>Item:</strong> ${esc(tx.sku)} — ${esc(tx.name)}</div><div><strong>Old:</strong> ${tx.oldQty.toLocaleString()} &nbsp; <strong>New:</strong> ${tx.newQty.toLocaleString()} &nbsp; <strong>Difference:</strong> ${tx.variance>=0?'+':''}${tx.variance.toLocaleString()}</div><div><strong>Reason:</strong> ${esc(tx.reason)}</div><div><strong>Unit Cost:</strong> $${tx.unitCost.toFixed(2)} &nbsp; <strong>Cost Impact:</strong> ${tx.costImpact<0?'-':'+'}$${Math.abs(tx.costImpact).toFixed(2)}</div>${tx.approvedBy?`<div><strong>Approved By:</strong> ${esc(tx.approvedBy)}</div>`:''}`;
  app.innerHTML=`<section class="completion-card"><div class="completion-icon">✓</div><div class="eyebrow" style="margin-top:14px">FINISHED</div><h2>${kind==='receive'?'Receiving Finished':kind==='transfer'?'Transfer Created':'Adjustment Finished'}</h2><p class="muted">${esc(tx.ref)} · ${fmtDate(tx.date)} · ${esc(tx.employee)}</p><div class="ticket-preview"><div class="ticket-head">${details}</div>${kind==='adjust'?'':`<table><thead><tr><th>Material</th><th>Qty</th><th>Problems</th></tr></thead><tbody>${lineRows}</tbody></table>`}</div><div class="completion-actions"><button id="printTicket" class="print-btn">🖨 Print</button>${kind!=='adjust'?'<button id="printLabels" class="label-btn">▣ Print Labels</button>':''}<button id="doneTx" class="primary">Done</button></div><p class="permission-note">Print opens the normal Windows or iPhone print screen.</p></section>`;
  document.getElementById('printTicket').onclick=()=>printTicket(tx,kind);
  const labels=document.getElementById('printLabels'); if(labels) labels.onclick=()=>printLabels(tx,kind);
  document.getElementById('doneTx').onclick=()=>go(kind==='receive'?'receive':kind==='transfer'?'transfer':'adjust');
}
function printWindow(title,body){
  const w=window.open('','_blank','width=900,height=700');
  if(!w){notify('Allow pop-ups to print');return;}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111;margin:28px}h1{font-size:22px;margin:0 0 4px}.muted{color:#555}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin:18px 0;padding:14px;border:1px solid #bbb;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #bbb;padding:9px;text-align:left;font-size:13px}th{background:#eee}.sig{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.line{border-top:1px solid #333;padding-top:5px;margin-top:36px;font-size:12px}@media print{button{display:none}}</style></head><body>${body}<script>window.onload=()=>{setTimeout(()=>window.print(),150)}<\/script></body></html>`);w.document.close();
}
function printTicket(tx,kind){
  let body=`<h1>Bargain Moulding — ${esc(tx.type)} Ticket</h1><div class="muted">${esc(tx.ref)} · ${fmtDate(tx.date)}</div><div class="meta"><div><strong>Employee</strong><br>${esc(tx.employee)}</div><div><strong>Location</strong><br>${esc(tx.location||tx.from||'')}</div>`;
  if(kind==='receive') body+=`<div><strong>PO</strong><br>${esc(tx.po)}</div><div><strong>Supplier</strong><br>${esc(tx.supplier)}</div><div><strong>Status</strong><br>${esc(tx.status)}</div><div><strong>Good Pieces</strong><br>${tx.total}</div>`;
  if(kind==='transfer') body+=`<div><strong>Move From</strong><br>${esc(tx.from)}</div><div><strong>Move To</strong><br>${esc(tx.to)}</div><div><strong>Total Pieces</strong><br>${tx.total}</div><div><strong>Status</strong><br>${esc(tx.status||'Ready to Move')}</div>${tx.note?`<div><strong>Note</strong><br>${esc(tx.note)}</div>`:''}`;
  if(kind==='adjust') body+=`<div><strong>SKU</strong><br>${esc(tx.sku)}</div><div><strong>Reason</strong><br>${esc(tx.reason)}</div><div><strong>Old Quantity</strong><br>${tx.oldQty.toLocaleString()}</div><div><strong>New Quantity</strong><br>${tx.newQty.toLocaleString()}</div><div><strong>Difference</strong><br>${tx.variance>=0?'+':''}${tx.variance.toLocaleString()}</div><div><strong>Unit Cost</strong><br>$${tx.unitCost.toFixed(2)}</div><div><strong>Cost Impact</strong><br>${tx.costImpact<0?'-':'+'}$${Math.abs(tx.costImpact).toFixed(2)}</div>${tx.approvedBy?`<div><strong>Approved By</strong><br>${esc(tx.approvedBy)}</div>`:''}`;
  body+='</div>';
  if(kind!=='adjust') body+=`<table><thead><tr><th>SKU</th><th>Description</th><th>Qty</th><th>Problems</th></tr></thead><tbody>${(tx.lines||[]).map(l=>`<tr><td>${esc(l.sku||'')}</td><td>${esc(l.name||'')}</td><td>${Number(l.qty||0).toLocaleString()}</td><td>${l.problems?.length?l.problems.map(p=>`${esc(p.type)} — ${p.qty}${p.note?` — ${esc(p.note)}`:''}${p.photo?' — photo attached':''}`).join('<br>'):'—'}</td></tr>`).join('')}</tbody></table>`;
  body+=`<div class="sig"><div class="line">Employee Signature</div><div class="line">Manager / Receiver</div></div>`;
  printWindow(`${tx.type} ${tx.ref}`,body);
}
function printLabels(tx,kind){
  const lines=(tx.lines||[]).filter(l=>Number(l.qty||0)>0);
  if(!lines.length){notify('No material labels to print');return;}
  const labels=[];
  for(const line of lines){const count=Math.max(1,Math.ceil(Number(line.qty||0))),barcode=String(line.barcode||line.sku||'').trim();for(let item=1;item<=count;item++)labels.push(`<section class="label"><div class="brand">BARGAIN MOULDING</div><div class="sku">${esc(line.sku||'')}</div><div class="name">${esc(line.name||'')}</div><div class="barcode">${window.bmCode39Svg?window.bmCode39Svg(barcode,true):`<strong>${esc(barcode)}</strong>`}</div><div class="foot"><span>${kind==='receive'?`PO ${esc(tx.po)}`:`${esc(tx.from)} → ${esc(tx.to)}`}</span><span>ITEM ${item} OF ${count}</span></div></section>`)}
  const w=window.open('','_blank','width=900,height=700'); if(!w){notify('Allow pop-ups to print');return;}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Material Labels</title><style>@page{size:5in 3in;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,sans-serif;color:#000}.label{width:5in;height:3in;padding:.18in .22in;overflow:hidden;break-after:page;page-break-after:always;display:flex;flex-direction:column}.label:last-child{break-after:auto;page-break-after:auto}.brand{font-size:9pt;font-weight:800;letter-spacing:.1em;border-bottom:2px solid #000;padding-bottom:.05in}.sku{font-size:24pt;font-weight:900;line-height:1;margin-top:.08in}.name{font-size:11pt;line-height:1.15;margin:.05in 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barcode{height:1.12in;padding:0 .16in;margin-top:.02in;display:flex;align-items:center;justify-content:center;overflow:hidden}.barcode svg{display:block;width:100%;height:1.08in;max-width:4.25in}.barcode strong{font-size:22pt}.foot{display:flex;justify-content:space-between;gap:.12in;margin-top:auto;border-top:1px solid #000;padding-top:.06in;font-size:9pt;font-weight:700;white-space:nowrap}@media screen{body{background:#eee}.label{background:#fff;margin:.2in auto;box-shadow:0 2px 12px #aaa}}@media print{body{background:#fff}.label{margin:0}}</style></head><body>${labels.join('')}<script>window.onload=()=>{setTimeout(()=>window.print(),250)}<\/script></body></html>`);w.document.close();
}

function notify(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}
init();

</script>
</body>
</html>
