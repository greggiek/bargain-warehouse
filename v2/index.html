<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM Warehouse V2</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08111f; color: #eef4ff; }
    main { width: min(680px, calc(100% - 32px)); padding: 40px; border: 1px solid #26364d; border-radius: 20px; background: #101c2d; box-shadow: 0 24px 80px #0008; }
    .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #2563eb; font-weight: 800; }
    h1 { margin: 20px 0 8px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -0.04em; }
    p { margin: 0; color: #a9b8cc; font-size: 18px; line-height: 1.6; }
    .status { display: flex; gap: 10px; align-items: center; margin-top: 28px; color: #c7f9d4; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 16px #22c55e; }
  </style>
</head>
<body>
  <main>
    <span class="mark">BM</span>
    <h1>BM Warehouse V2</h1>
    <p>A clean warehouse operating system for Bargain Moulding. Native inventory, purchasing, transfers and production—with no Qoblex dependency.</p>
    <div class="status"><span class="dot"></span> Foundation environment ready</div>
  </main>
</body>
</html>
